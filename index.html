<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ID Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #111827;
}

.hidden {
    display: none !important;
}

.screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: min(900px, 100%);
    background: white;
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.12);
}

h1 {
    margin: 0 0 8px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 24px;
}

.scanner {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    background: #111;
    border-radius: 22px;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.scan-box {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 18%;
    bottom: 18%;
    border: 3px solid rgba(255,255,255,.45);
    border-radius: 18px;
    transition: .25s;
}

.scan-box.detected {
    border-color: #22c55e;
    box-shadow: 0 0 35px rgba(34,197,94,.35);
}

.status {
    margin-top: 18px;
    padding: 14px 16px;
    background: #f3f4f6;
    border-radius: 14px;
    font-weight: 600;
}

.progress {
    margin-top: 12px;
    height: 8px;
    background: #e5e7eb;
    border-radius: 99px;
    overflow: hidden;
}

.progress div {
    width: 0%;
    height: 100%;
    transition: width .2s;
    background: #2563eb;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button.secondary {
    background: #e5e7eb;
    color: #111827;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.results {
    margin-top: 20px;
    display: grid;
    gap: 12px;
}

.result {
    padding: 15px;
    background: #f8fafc;
    border-radius: 14px;
}

.result strong {
    display: block;
    margin-bottom: 4px;
}

.profile {
    text-align: center;
}

.profile-picture {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    background: #e5e7eb;
    display: block;
    margin: 0 auto 16px;
}

.account-name {
    font-size: 28px;
    font-weight: 800;
}

.account-id {
    color: #6b7280;
    margin-top: 4px;
}

input[type=file] {
    display: none;
}

.crop-area {
    margin-top: 20px;
    text-align: center;
}

.crop-preview {
    width: 260px;
    height: 260px;
    object-fit: contain;
    background: #111;
    border-radius: 20px;
}

.email {
    margin-top: 12px;
    padding: 12px;
    background: #eff6ff;
    color: #1d4ed8;
    border-radius: 12px;
    font-weight: 700;
}
</style>
</head>

<body>

<!-- SCANNER -->
<section id="scannerScreen" class="screen">
    <div class="card">

        <h1>ID Scanner</h1>
        <div class="subtitle">
            Position the card inside the frame. Scanning happens automatically.
        </div>

        <div class="scanner">
            <video id="video" autoplay playsinline muted></video>

            <div id="overlay">
                <div id="scanBox" class="scan-box"></div>
            </div>
        </div>

        <div id="status" class="status">
            Camera starting...
        </div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <div class="controls">
            <button id="startButton">Start camera</button>
            <button id="stopButton" class="secondary">Stop</button>
        </div>

        <div id="results" class="results hidden">
            <div class="result">
                <strong>Name</strong>
                <span id="nameResult">Not detected</span>
            </div>

            <div class="result">
                <strong>ID</strong>
                <span id="idResult">Not detected</span>
            </div>

            <div class="result">
                <strong>Barcode</strong>
                <span id="barcodeResult">Not detected</span>
            </div>
        </div>

    </div>
</section>


<!-- ACCOUNT -->
<section id="accountScreen" class="screen hidden">
    <div class="card">

        <div class="profile">

            <img
                id="profilePicture"
                class="profile-picture"
                alt="Profile picture"
            >

            <div class="account-name" id="accountName"></div>
            <div class="account-id" id="accountId"></div>
            <div class="email" id="accountEmail"></div>

            <div class="controls" style="justify-content:center">
                <label>
                    <input id="photoInput" type="file" accept="image/*">
                    <button type="button" onclick="photoInput.click()">
                        Change profile picture
                    </button>
                </label>

                <button
                    id="logoutButton"
                    class="secondary"
                    type="button"
                >
                    Reset
                </button>
            </div>

            <div id="cropArea" class="crop-area hidden">

                <h3>Crop profile picture</h3>

                <canvas
                    id="cropCanvas"
                    width="500"
                    height="500"
                    class="crop-preview"
                ></canvas>

                <div class="controls" style="justify-content:center">
                    <button id="usePhotoButton">
                        Use photo
                    </button>

                    <button
                        id="cancelPhotoButton"
                        class="secondary"
                    >
                        Cancel
                    </button>
                </div>

            </div>

        </div>

    </div>
</section>


<!-- Temporary processing canvas.
     It is never displayed and is cleared after processing. -->
<canvas id="processingCanvas" class="hidden"></canvas>


<script>
const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const scanBox = document.getElementById("scanBox");

const processingCanvas =
    document.getElementById("processingCanvas");

const scannerScreen =
    document.getElementById("scannerScreen");

const accountScreen =
    document.getElementById("accountScreen");

const results =
    document.getElementById("results");

let stream = null;
let scanning = false;
let processing = false;

let frames = [];
let stableFrames = 0;
let lastDetection = null;

let worker = null;


/* -------------------------------------------------------
   CAMERA
------------------------------------------------------- */

async function startCamera() {

    if (scanning) return;

    try {

        statusBox.textContent =
            "Requesting camera access...";

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                }
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        scanning = true;

        statusBox.textContent =
            "Looking for an ID card...";

        requestAnimationFrame(scanLoop);

    } catch (err) {

        console.error(err);

        statusBox.textContent =
            "Camera access was denied or unavailable.";

    }
}


function stopCamera() {

    scanning = false;

    if (stream) {

        stream.getTracks().forEach(track => {
            track.stop();
        });

        stream = null;
    }

    video.srcObject = null;
}


/* -------------------------------------------------------
   DOCUMENT DETECTION
------------------------------------------------------- */

function detectDocument() {

    if (
        typeof cv === "undefined" ||
        !cv.Mat
    ) {
        return null;
    }

    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {
        return null;
    }

    const width = 640;

    const height =
        Math.round(
            video.videoHeight *
            width /
            video.videoWidth
        );

    processingCanvas.width = width;
    processingCanvas.height = height;

    const ctx =
        processingCanvas.getContext("2d", {
            willReadFrequently: true
        });

    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    const src =
        cv.imread(processingCanvas);

    const gray = new cv.Mat();
    const blur = new cv.Mat();
    const edges = new cv.Mat();

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );

    cv.GaussianBlur(
        gray,
        blur,
        new cv.Size(5,5),
        0
    );

    cv.Canny(
        blur,
        edges,
        60,
        180
    );

    const contours =
        new cv.MatVector();

    const hierarchy =
        new cv.Mat();

    cv.findContours(
        edges,
        contours,
        hierarchy,
        cv.RETR_EXTERNAL,
        cv.CHAIN_APPROX_SIMPLE
    );

    let best = null;
    let bestArea = 0;

    for (
        let i = 0;
        i < contours.size();
        i++
    ) {

        const contour =
            contours.get(i);

        const area =
            cv.contourArea(contour);

        if (area < width * height * 0.12) {
            contour.delete();
            continue;
        }

        const perimeter =
            cv.arcLength(
                contour,
                true
            );

        const approx =
            new cv.Mat();

        cv.approxPolyDP(
            contour,
            approx,
            perimeter * 0.02,
            true
        );

        if (approx.rows === 4) {

            const rect =
                cv.boundingRect(contour);

            const ratio =
                rect.width / rect.height;

            const cardLike =
                ratio >= 1.25 &&
                ratio <= 2.0;

            if (
                cardLike &&
                area > bestArea
            ) {

                const points = [];

                for (
                    let j = 0;
                    j < 4;
                    j++
                ) {

                    points.push({
                        x: approx.data32S[j * 2],
                        y: approx.data32S[j * 2 + 1]
                    });
                }

                best = points;
                bestArea = area;
            }
        }

        approx.delete();
        contour.delete();
    }

    src.delete();
    gray.delete();
    blur.delete();
    edges.delete();
    contours.delete();
    hierarchy.delete();

    return best;
}


/* -------------------------------------------------------
   LIVE SCANNER
------------------------------------------------------- */

async function scanLoop() {

    if (!scanning) return;

    if (!processing) {

        const detection =
            detectDocument();

        if (detection) {

            scanBox.classList.add("detected");

            stableFrames++;

            statusBox.textContent =
                `ID detected • stabilizing ${Math.min(
                    stableFrames,
                    8
                )}/8`;

            lastDetection = detection;

            if (stableFrames >= 8) {

                stableFrames = 0;

                await captureFrame();

            }

        } else {

            stableFrames = 0;

            scanBox.classList.remove("detected");

            statusBox.textContent =
                "Looking for an ID card...";
        }
    }

    requestAnimationFrame(scanLoop);
}


/* -------------------------------------------------------
   MULTI-FRAME OCR
------------------------------------------------------- */

async function captureFrame() {

    if (processing) return;

    processing = true;

    statusBox.textContent =
        "Reading the ID...";

    frames = [];

    /*
       Take several temporary frames.

       These are held only in memory while OCR runs.
    */

    for (let i = 0; i < 5; i++) {

        const canvas =
            document.createElement("canvas");

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;

        const ctx =
            canvas.getContext("2d", {
                willReadFrequently: true
            });

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );

        frames.push(canvas);

        await sleep(180);

        progressBar.style.width =
            `${(i + 1) * 10}%`;
    }

    const info =
        await analyzeFrames();

    /*
       CRITICAL:
       Delete every temporary camera frame.
    */

    frames.forEach(canvas => {

        canvas.width = 1;
        canvas.height = 1;

        const ctx =
            canvas.getContext("2d");

        ctx.clearRect(0,0,1,1);
    });

    frames = [];

    processingCanvas.width = 1;
    processingCanvas.height = 1;

    const ctx =
        processingCanvas.getContext("2d");

    ctx.clearRect(0,0,1,1);

    if (info.name || info.idNumber) {

        showResults(info);

    } else {

        statusBox.textContent =
            "Couldn't read the card clearly. Try again.";

        processing = false;
        progressBar.style.width = "0%";

        return;
    }

    processing = false;
}


/* -------------------------------------------------------
   OCR
------------------------------------------------------- */

async function analyzeFrames() {

    if (!worker) {

        worker =
            await Tesseract.createWorker(
                "eng",
                1,
                {
                    logger: message => {

                        if (
                            message.status ===
                            "recognizing text"
                        ) {

                            const percent =
                                Math.round(
                                    message.progress * 100
                                );

                            progressBar.style.width =
                                `${50 + percent / 2}%`;
                        }
                    }
                }
            );
    }

    let bestText = "";
    let bestScore = 0;

    for (
        const canvas of frames
    ) {

        const result =
            await worker.recognize(canvas);

        const text =
            result.data.text || "";

        const confidence =
            result.data.confidence || 0;

        if (confidence > bestScore) {

            bestScore = confidence;
            bestText = text;
        }
    }

    return parseID(bestText);
}


/* -------------------------------------------------------
   ID PARSER
------------------------------------------------------- */

function parseID(text) {

    const cleaned =
        text
            .replace(/\r/g, "\n")
            .replace(/[|]/g, "I");

    const lines =
        cleaned
            .split("\n")
            .map(x => x.trim())
            .filter(Boolean);

    let name = "";

    /*
       The name on this style of card is underneath
       the portrait. OCR isn't given a fixed name,
       so we look for likely human-name lines.
    */

    for (let line of lines) {

        const normalized =
            line
                .replace(/[^A-Za-z .'-]/g, "")
                .trim();

        const words =
            normalized.split(/\s+/);

        if (
            words.length >= 2 &&
            words.length <= 4 &&
            words.every(
                word =>
                    /^[A-Za-z][A-Za-z'-]*$/.test(word)
            )
        ) {

            if (
                !/middle|school|grade|student|id/i
                    .test(normalized)
            ) {

                name = normalized;
                break;
            }
        }
    }

    /*
       Find a long numeric ID.
    */

    const numbers =
        cleaned.match(/\b\d{6,12}\b/g) || [];

    let idNumber =
        numbers.length
            ? numbers[0]
            : "";

    /*
       Prefer the number immediately associated
       with "ID".
    */

    const idMatch =
        cleaned.match(
            /ID\s*#?\s*([0-9]{5,12})/i
        );

    if (idMatch) {
        idNumber = idMatch[1];
    }

    /*
       BarcodeDetector is attempted separately.
       OCR can still provide the ID fallback.
    */

    return {
        name,
        idNumber,
        barcode: ""
    };
}


/* -------------------------------------------------------
   BARCODE
------------------------------------------------------- */

async function readBarcode(canvas) {

    if (
        !("BarcodeDetector" in window)
    ) {
        return "";
    }

    try {

        const formats = [
            "code_128",
            "code_39",
            "ean_13",
            "ean_8",
            "itf"
        ];

        const detector =
            new BarcodeDetector({
                formats
            });

        const codes =
            await detector.detect(canvas);

        if (codes.length) {

            return codes[0].rawValue || "";
        }

    } catch (err) {

        console.log(
            "Barcode detection unavailable",
            err
        );
    }

    return "";
}


/* -------------------------------------------------------
   RESULTS
------------------------------------------------------- */

async function showResults(info) {

    const barcode =
        await readBarcode(
            frames[0] || processingCanvas
        );

    if (barcode) {

        info.barcode = barcode;

        /*
           If barcode is numeric and matches an ID,
           use it as the ID source.
        */

        if (
            /^\d+$/.test(barcode)
        ) {

            info.idNumber =
                barcode;
        }
    }

    document.getElementById(
        "nameResult"
    ).textContent =
        info.name || "Not detected";

    document.getElementById(
        "idResult"
    ).textContent =
        info.idNumber || "Not detected";

    document.getElementById(
        "barcodeResult"
    ).textContent =
        info.barcode || "Not detected";

    results.classList.remove("hidden");

    /*
       Demo access condition.
       Change this for your own authorized test data.
    */

    const allowed =
        info.name &&
        info.name
            .toLowerCase()
            .includes("ethan");

    if (allowed) {

        statusBox.textContent =
            "Identity recognized. Opening account...";

        await sleep(700);

        createAccount(info);

    } else {

        statusBox.textContent =
            "ID detected, but this account isn't authorized.";

        progressBar.style.width = "100%";
    }
}


/* -------------------------------------------------------
   ACCOUNT
------------------------------------------------------- */

function createAccount(info) {

    /*
       Only extracted text is retained.
       No camera image is stored.
    */

    const id =
        info.idNumber || "unknown";

    const lastFive =
        id
            .replace(/\D/g, "")
            .slice(-5);

    const email =
        lastFive
            ? `dg${lastFive}@students.dg58.org`
            : "student@example.local";

    const account = {
        name: info.name,
        idNumber: id,
        email
    };

    localStorage.setItem(
        "demoAccount",
        JSON.stringify(account)
    );

    showAccount(account);
}


function showAccount(account) {

    stopCamera();

    scannerScreen.classList.add("hidden");
    accountScreen.classList.remove("hidden");

    document.getElementById(
        "accountName"
    ).textContent =
        account.name;

    document.getElementById(
        "accountId"
    ).textContent =
        `ID: ${account.idNumber}`;

    document.getElementById(
        "accountEmail"
    ).textContent =
        account.email;

    /*
       Default avatar.
       This is NOT taken from the ID.
    */

    document.getElementById(
        "profilePicture"
    ).src =
        createDefaultAvatar(account.name);
}


/* -------------------------------------------------------
   PROFILE PHOTO
------------------------------------------------------- */

const photoInput =
    document.getElementById("photoInput");

const cropCanvas =
    document.getElementById("cropCanvas");

const cropArea =
    document.getElementById("cropArea");

const cropCtx =
    cropCanvas.getContext("2d");

let selectedImage = null;

photoInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload = () => {

            const img =
                new Image();

            img.onload = () => {

                selectedImage = img;

                drawCrop(img);

                cropArea.classList.remove(
                    "hidden"
                );
            };

            img.src =
                reader.result;
        };

        reader.readAsDataURL(file);
    }
);


function drawCrop(img) {

    const size =
        Math.min(
            img.width,
            img.height
        );

    const sx =
        (img.width - size) / 2;

    const sy =
        (img.height - size) / 2;

    cropCtx.clearRect(
        0,
        0,
        500,
        500
    );

    cropCtx.drawImage(
        img,
        sx,
        sy,
        size,
        size,
        0,
        0,
        500,
        500
    );
}


document.getElementById(
    "usePhotoButton"
).onclick = () => {

    document.getElementById(
        "profilePicture"
    ).src =
        cropCanvas.toDataURL(
            "image/jpeg",
            0.9
        );

    cropArea.classList.add(
        "hidden"
    );

    photoInput.value = "";
};


document.getElementById(
    "cancelPhotoButton"
).onclick = () => {

    cropArea.classList.add(
        "hidden"
    );

    photoInput.value = "";
};


/* -------------------------------------------------------
   RESET
------------------------------------------------------- */

document.getElementById(
    "logoutButton"
).onclick = () => {

    localStorage.removeItem(
        "demoAccount"
    );

    location.reload();
};


/* -------------------------------------------------------
   DEFAULT AVATAR
------------------------------------------------------- */

function createDefaultAvatar(name) {

    const letter =
        (name || "?")
            .trim()
            .charAt(0)
            .toUpperCase();

    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="500"
             height="500">
            <rect
                width="500"
                height="500"
                rx="250"
                fill="#2563eb"/>
            <text
                x="250"
                y="315"
                text-anchor="middle"
                font-size="230"
                font-family="Arial"
                fill="white">${letter}</text>
        </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
}


/* -------------------------------------------------------
   UTILITIES
------------------------------------------------------- */

function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}


document.getElementById(
    "startButton"
).onclick = startCamera;

document.getElementById(
    "stopButton"
).onclick = stopCamera;


/* -------------------------------------------------------
   RESTORE LOCAL DEMO ACCOUNT
------------------------------------------------------- */

const saved =
    localStorage.getItem(
        "demoAccount"
    );

if (saved) {

    try {

        const account =
            JSON.parse(saved);

        showAccount(account);

    } catch {

        localStorage.removeItem(
            "demoAccount"
        );

        startCamera();
    }

} else {

    startCamera();
}

</script>

</body>
</html>
